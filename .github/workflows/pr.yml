name: PR Build Check

on:
  pull_request:

# Every job only builds, lints or tests the checked-out tree.
permissions:
  contents: read

jobs:
  site:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Generate Static Site
        run: pixi run mkdocs build
  editorconfig-checker:
    name: Check editorconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Run editorconfig-checker
        run: pixi run editorconfig-checker
  proto-format-check:
    name: Check Protobuf Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Lint Protobuf
        run: pixi run lint-protobuf
      - name: Check Protobuf Style
        run: pixi run check-protobuf
  proto:
    name: Check Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Compile protobuf
        run: pixi run generate-protobuf
  antlr-go:
    name: Check Go ANTLR Parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Generate Go ANTLR parsers
        run: pixi run generate-antlr-go
      - name: Compile Go ANTLR parsers
        working-directory: gen/antlr/go
        run: |
          go mod init example.com/antlrcheck
          go get github.com/antlr4-go/antlr/v4@v4.13.1
          go build ./...
  antlr-java:
    name: Check Java ANTLR Parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Generate Java ANTLR parsers
        run: pixi run generate-antlr-java
      - name: Compile Java ANTLR parsers
        run: |
          mkdir -p gen/antlr/java/classes
          pixi run bash -c \
            'javac -cp "$CONDA_PREFIX/lib/antlr4.jar" -d gen/antlr/java/classes gen/antlr/java/*.java'
  antlr-cpp:
    name: Check C++ ANTLR Parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
          environments: antlr-cpp
      - name: Generate C++ ANTLR parsers
        run: pixi run -e antlr-cpp generate-antlr-cpp
      - name: Check C++ ANTLR parser compilation
        run: |
          pixi run -e antlr-cpp bash -c \
            'c++ -std=c++17 -fsyntax-only -I "$CONDA_PREFIX/include/antlr4-runtime" gen/antlr/cpp/*.cpp'
  antlr-csharp:
    name: Check C# ANTLR Parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate C# ANTLR parsers
        run: pixi run generate-antlr-csharp
      - name: Compile C# ANTLR parsers
        run: |
          dotnet new classlib --name AntlrCheck --framework netstandard2.0 --output gen/antlr/csharp --no-restore
          dotnet add gen/antlr/csharp/AntlrCheck.csproj package Antlr4.Runtime.Standard --version 4.13.1
          dotnet build gen/antlr/csharp/AntlrCheck.csproj
  yamllint:
    name: Lint YAML extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Run yamllint
        run: pixi run yamllint
  yamlvalidate:
    name: Validate YAML extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Validate YAML extensions
        run: |
          pixi run check-jsonschema
  dry_run_release:
    name: Dry-run release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Dry-run release
        run: pixi run dry-run
  python-style:
    name: Style-check and lint Python files, and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Generate protobuf bindings
        run: pixi run generate-protobuf
      - name: Ruff format check
        run: pixi run ruff-format-check
      - name: Ruff lint
        run: pixi run ruff-lint
      - name: Run tests including test_substrait_extension_coverage
        run: pixi run test
  check-proto-prefix:
    name: Check proto-prefix.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Run proto-prefix.py
        run: pixi run tools/proto_prefix.py output test proto go_package=github.com/test/proto
      - name: Modify buf config to build rewritten proto files
        run: |
          echo "version: v1" > buf.work.yaml
          echo "directories:" >> buf.work.yaml
          echo "  - output" >> buf.work.yaml
      - name: Compile rewritten proto files
        run: pixi run buf generate
