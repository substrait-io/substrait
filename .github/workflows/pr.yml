name: PR Build Check

on:
  pull_request:

# Every job only builds, lints or tests the checked-out tree.
permissions:
  contents: read

jobs:
  site:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Generate Static Site
        run: pixi run mkdocs build
  editorconfig-checker:
    name: Check editorconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Run editorconfig-checker
        run: pixi run editorconfig-checker
  proto-format-check:
    name: Check Protobuf Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Lint Protobuf
        run: pixi run lint-protobuf
      - name: Check Protobuf Style
        run: pixi run check-protobuf
  proto:
    name: Check Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Compile protobuf
        run: pixi run generate-protobuf
  antlr:
    name: Check Python and Go ANTLR Parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Generate Python and Go ANTLR parsers
        run: pixi run generate-antlr
      - name: Compile Go ANTLR parsers
        working-directory: tests/antlr_go
        run: |
          go mod init example.com/antlrcheck
          go get github.com/antlr4-go/antlr/v4@v4.13.1
          go build ./...
  yamllint:
    name: Lint YAML extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Run yamllint
        run: pixi run yamllint
  yamlvalidate:
    name: Validate YAML extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Validate YAML extensions
        run: |
          pixi run check-jsonschema
  dry_run_release:
    name: Dry-run release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Dry-run release
        run: pixi run dry-run
  python-style:
    name: Style-check and lint Python files, and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Generate protobuf bindings
        run: pixi run generate-protobuf
      - name: Ruff format check
        run: pixi run ruff-format-check
      - name: Ruff lint
        run: pixi run ruff-lint
      - name: Run tests including test_substrait_extension_coverage
        run: pixi run test
  check-proto-prefix:
    name: Check proto-prefix.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
      - name: Run proto-prefix.py
        run: pixi run tools/proto_prefix.py output test proto go_package=github.com/test/proto
      - name: Modify buf config to build rewritten proto files
        run: |
          echo "version: v1" > buf.work.yaml
          echo "directories:" >> buf.work.yaml
          echo "  - output" >> buf.work.yaml
      - name: Compile rewritten proto files
        run: pixi run buf generate
