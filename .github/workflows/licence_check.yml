name: License check

on: pull_request

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check License Header
      uses: enarx/spdx@d4020ee98e3101dd487c5184f27c6a6fb4f88709 # master
      with:
        licenses: |-
          Apache-2.0
          MIT
